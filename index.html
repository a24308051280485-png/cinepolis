<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cinepolis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: white;
        }
        /* Encabezado azul fuerte, Times New Roman, centrado y con negrita */
        header {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;
            font-family: "Times New Roman", Times, serif;
            font-size: 35px;
            font-weight: bold;
        }
        /* Barra de navegacion sencilla */
        nav {
            background-color: darkblue;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        /* Cuerpo */
        .contenedor {
            text-align: center;
            padding: 20px;
        }
        h2 {
            color: darkblue;
        }
        .pelicula {
            display: inline-block;
            width: 200px;
            margin: 15px;
            vertical-align: top;
            border: 1px solid gray;
            padding: 10px;
        }
        .pelicula img {
            width: 100%;
            height: 280px;
        }
        /* Footer con tu nombre y grado */
        footer {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Encabezado con saltos de linea y negrita -->
    <header>
        <b>Cinépolis</b><br>
        Cartelera Oficial
    </header>

    <!-- Barra de navegacion -->
    <nav>
        <a href="index.html">Cartelera</a>
        <a href="club.html">Club Cinépolis</a>
    </nav>

    <!-- Cuerpo -->
    <div class="contenedor">
        <h2>Peliculas en Cartelera</h2>
        
        <div class="pelicula">
            <img src="spiderman.jpg" alt="Spider-Man">
            <h3>Spider-Man</h3>
            <p>Un nuevo día</p>
        </div>

        <div class="pelicula">
            <img src="cine.jpg" alt="Your Name">
            <h3>Your Name</h3>
            <p>Animación</p>
        </div>

        <div class="pelicula">
            <img src="noche.jpg" alt="La Noche del Demonio">
            <h3>La Noche del Demonio</h3>
            <p>Terror</p>
        </div>

        <h2>Proximos Estrenos</h2>

        <div class="pelicula">
            <img src="resident.jpg" alt="Resident Evil">
            <h3>Resident Evil</h3>
            <p>Noche Cero</p>
        </div>

        <div class="pelicula">
            <img src="charro.jpg" alt="El Charro Negro">
            <h3>Charro Negro</h3>
            <p>Estreno</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <br>
        <p><b>Brissa Araceli Arreola Hurtado</b></p>
        <p>Grado y Grupo: <b>5°I</b></p>
        <br>
    </footer>

</body>
</html>
